apply plugin: 'java-library'

sourceCompatibility = 1.8
targetCompatibility = 1.8

sourceSets {
    main {
        java.srcDirs = ["src/"]
    }
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

dependencies {
    implementation project(':core')
    api "com.badlogicgames.gdx:gdx-backend-lwjgl3:$gdxVersion"
    api "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-desktop"
}

// 実行可能 fat jar（dopamine-mall-desktop.jar）を作る
tasks.register('dist', Jar) {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    archiveFileName = 'dopamine-mall-desktop.jar'
    manifest {
        attributes 'Main-Class': 'com.nutomu.dopaminemall.DesktopLauncher'
    }
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
    // libGDX のアセット（android/assets）を jar のルートに含める。
    // Gdx.files.internal("music/title.wav") などがデスクトップ版でも読める。
    from(project(":android").file("assets"))
    with jar
}
