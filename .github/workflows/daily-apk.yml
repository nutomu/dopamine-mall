name: Daily APK

on:
  schedule:
    # 毎日 00:00 UTC = 日本時間 9:00
    - cron: '0 0 * * *'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Write version file
        # タイトル画面に表示するビルド情報（git の短いハッシュ＋ビルド日時）。
        # android/assets は APK とデスクトップ jar の両方に含まれる共有アセット。
        # ビルド前に書き出すこと（Gradle がアセットを取り込む前に必要）。
        run: |
          printf '%s\n%s\n' "$(git rev-parse --short HEAD)" "$(date -u '+%Y-%m-%d %H:%M UTC')" > android/assets/version.txt
          cat android/assets/version.txt

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew :android:assembleDebug --stacktrace

      - name: Rename APK
        run: cp android/build/outputs/apk/debug/android-debug.apk dopamine-mall-debug.apk

      - name: Build desktop jar
        run: ./gradlew :desktop:dist --stacktrace

      - name: Copy desktop jar
        run: cp desktop/build/libs/dopamine-mall-desktop.jar dopamine-mall-desktop.jar

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: dopamine-mall-debug-apk
          path: dopamine-mall-debug.apk

      - name: Upload desktop jar as artifact
        uses: actions/upload-artifact@v4
        with:
          name: dopamine-mall-desktop-jar
          path: dopamine-mall-desktop.jar

      - name: Publish nightly release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: ドパミン・モール 日次ビルド
          body: |
            ドパミン・モールの日次ビルド（開発版）です。

            ## ブラウザ（Web版）で遊ぶ
            https://nutomu.github.io/dopamine-mall/ を開くと、ブラウザでそのまま遊べます（インストール不要）。
            キーボードの矢印キー / WASD で遊べます。

            ## Fire TV Stick で遊ぶ
            下の dopamine-mall-debug.apk をダウンロードして、Fire TV Stick へサイドロードして遊べます。

            ### Fire TV Stick への入れ方
            1. Fire TV Stick の「設定」→「マイ Fire TV」→「開発者オプション」で「不明なアプリのインストール」を許可します。
            2. Downloader アプリなどでこの APK をダウンロードしてインストールします。
            3. ゲームパッドまたは Fire TV リモコンの十字キーで遊べます。

            ## PC（デスクトップ版）で遊ぶ
            下の dopamine-mall-desktop.jar をダウンロードして、次のコマンドで起動します。Java 17 が必要です。

            ```
            java -jar dopamine-mall-desktop.jar
            ```

            キーボードの矢印キー / WASD で遊べます。

            注意：開発中のバージョンです。動作が不安定な場合があります。
          files: |
            dopamine-mall-debug.apk
            dopamine-mall-desktop.jar
          fail_on_unmatched_files: true

  # Web版（HTML5/GWT）のビルドと GitHub Pages へのデプロイ。
  # APK・jar の build ジョブとは別ジョブで並行して動かす。
  web:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
      # Pages サイトの初回作成（POST /repos/.../pages）には administration 権限が必要。
      administration: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Write version file
        # タイトル画面に表示するビルド情報（git の短いハッシュ＋ビルド日時）。
        # GWT の PreloaderGenerator が android/assets を dist に取り込むため、
        # html:dist の前に書き出すこと。
        run: |
          printf '%s\n%s\n' "$(git rev-parse --short HEAD)" "$(date -u '+%Y-%m-%d %H:%M UTC')" > android/assets/version.txt
          cat android/assets/version.txt

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Web version
        run: ./gradlew :html:dist --stacktrace

      - name: Check dist contents
        # dist に index.html とアセット一覧（assets.txt）が含まれていること。
        # assets.txt が無いとゲーム起動時にアセットが読めない。
        run: |
          echo "--- dist top level ---"
          ls -la html/build/dist/
          echo "--- assets ---"
          ls html/build/dist/assets/ | head -20
          test -f html/build/dist/index.html
          test -f html/build/dist/assets/assets.txt
          echo "--- assets.txt (first 10 lines) ---"
          head -10 html/build/dist/assets/assets.txt
          echo "--- version.txt in assets ---"
          grep -c version.txt html/build/dist/assets/assets.txt || true

      - name: Configure Pages
        # 初回は Pages 自体が未設定のため、公開元を GitHub Actions にする。
        # enablement: true が無いと、Pages 未設定のリポジトリでは
        # "Get Pages site failed (Not Found)" で失敗する。
        # 既に設定済みの場合は何も変わらない。
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: html/build/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
